name: Disponibilidad del sitio

# Cada 15 minutos pide la portada. Si falla 3 veces seguidas, el workflow queda en
# rojo y GitHub avisa por correo a quien tenga activadas las notificaciones de
# Actions del repositorio (Settings de la cuenta → Notifications → Actions).
# URL: variable del repositorio SITE_URL (Settings → Variables); sin ella, la de Vercel.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portada:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/uptime.sh "${{ vars.SITE_URL || 'https://estudio-juridico-tau.vercel.app/' }}"
